# Default: production-like (request verification ON). For local manual tests use --spring.profiles.active=dev
spring.application.name=notifications-adapter
server.port=8081

# Alexa skill (must match developer console Interaction Model application id)
alexa.skill-id=amzn1.ask.skill.6fdf7c16-8b7e-4218-8746-4d9ae9a8f415
# Signature + timestamp verification (disable only for dev/test — see application-dev.properties)
alexa.verification.enabled=true
alexa.verification.timestamp-tolerance-seconds=150
