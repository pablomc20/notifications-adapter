services:
  notification-adpater-api:
    build: .
    container_name: notification-adpater-api
    restart: always
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alexa.rule=Host(`api.carpinteriamarqz.online`)"
      - "traefik.http.routers.alexa.entrypoints=websecure"
      - "traefik.http.routers.alexa.tls=true"
      - "traefik.http.routers.alexa.tls.certresolver=letsencrypt"
      - "traefik.http.services.alexa.loadbalancer.server.port=8080"

networks:
  web:
    external: true